<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151B"/>
      <stop offset="1" stop-color="#1F1E24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="64" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F2F1EE">claude-code-<tspan fill="#46AD5B">tint</tspan>-mod</text>
  <text x="66" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#C3C2B7">Tell your Claude Code windows apart.</text>
  <text x="66" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#898781">One color per repository · a ring on the window you are in</text>
  <text x="66" y="270" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#898781">Numbered threads · light and dark mode · a Claude Code mod</text>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">
    <rect x="66" y="300" width="88" height="30" rx="15" fill="#46AD5B" opacity="0.18"/>
    <text x="110" y="320" text-anchor="middle" fill="#7FD08F">/mod_tint</text>
    <rect x="166" y="300" width="118" height="30" rx="15" fill="#E8702A" opacity="0.18"/>
    <text x="225" y="320" text-anchor="middle" fill="#F4A26B">/mod_tint css</text>
    <rect x="296" y="300" width="64" height="30" rx="15" fill="#D0748F" opacity="0.18"/>
    <text x="328" y="320" text-anchor="middle" fill="#E7A3B7">MIT</text>
  </g>

  <!-- App illustration: sidebar + two split windows -->
  <g transform="translate(640 46)">
    <!-- app frame -->
    <rect x="0" y="0" width="584" height="308" rx="14" fill="#1A1A1F" stroke="#2C2B31"/>

    <!-- sidebar: neutral, repo names in color, threads numbered -->
    <rect x="0" y="0" width="128" height="308" rx="14" fill="#18181C"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">
      <circle cx="20" cy="30" r="5" fill="#46AD5B"/><text x="32" y="34" fill="#7FD08F">lab-notes</text>
      <rect x="10" y="44" width="110" height="20" rx="6" fill="#46AD5B" opacity="0.28"/>
      <rect x="10" y="44" width="4" height="20" rx="2" fill="#46AD5B"/>
      <text x="22" y="58" fill="#E9F5EC" font-weight="400">3  tint upgrade</text>
      <text x="22" y="82" fill="#9C9B95" font-weight="400">2  repo tidy</text>
      <circle cx="20" cy="112" r="5" fill="#E8702A"/><text x="32" y="116" fill="#F4A26B">studio</text>
      <rect x="10" y="126" width="110" height="20" rx="6" fill="none"/>
      <rect x="10" y="126" width="2" height="20" rx="1" fill="#E8702A"/>
      <text x="22" y="140" fill="#C9C8C0" font-weight="400">3  motion intro</text>
      <text x="22" y="164" fill="#9C9B95" font-weight="400">1  brand check</text>
      <circle cx="20" cy="194" r="5" fill="#D0748F"/><text x="32" y="198" fill="#E7A3B7">notes</text>
      <text x="22" y="222" fill="#9C9B95" font-weight="400">1  weekly plan</text>
    </g>

    <!-- window 1: focused, green ring with glow -->
    <rect x="140" y="12" width="210" height="284" rx="13" fill="none" stroke="#46AD5B" stroke-width="5" opacity="0.55" filter="url(#glow)"/>
    <rect x="144" y="16" width="202" height="276" rx="10" fill="#1F2A22"/>
    <rect x="140" y="12" width="210" height="284" rx="13" fill="none" stroke="#46AD5B" stroke-width="2.5"/>
    <rect x="156" y="28" width="96" height="9" rx="4.5" fill="#E9F5EC" opacity="0.8"/>
    <rect x="260" y="26" width="70" height="13" rx="6.5" fill="#46AD5B" opacity="0.3"/>
    <rect x="156" y="60" width="170" height="7" rx="3.5" fill="#C3C2B7" opacity="0.55"/>
    <rect x="156" y="74" width="148" height="7" rx="3.5" fill="#C3C2B7" opacity="0.55"/>
    <rect x="156" y="88" width="160" height="7" rx="3.5" fill="#C3C2B7" opacity="0.55"/>
    <rect x="214" y="112" width="112" height="22" rx="8" fill="#2E3A31"/>
    <rect x="156" y="148" width="166" height="7" rx="3.5" fill="#C3C2B7" opacity="0.55"/>
    <rect x="156" y="162" width="120" height="7" rx="3.5" fill="#C3C2B7" opacity="0.55"/>
    <!-- loading dots in the window color -->
    <circle cx="160" cy="190" r="2.6" fill="#46AD5B"/><circle cx="168" cy="186" r="2.6" fill="#46AD5B"/><circle cx="166" cy="195" r="2.6" fill="#46AD5B"/>
    <rect x="178" y="187" width="74" height="7" rx="3.5" fill="#898781" opacity="0.6"/>
    <!-- bottom area stays neutral, input tinted -->
    <rect x="152" y="236" width="186" height="44" rx="9" fill="#232327"/>
    <rect x="158" y="244" width="174" height="28" rx="8" fill="#22302A" stroke="#46AD5B" stroke-width="1.5"/>

    <!-- window 2: other window, light tint, thin ring -->
    <rect x="364" y="12" width="210" height="284" rx="13" fill="#24201D" stroke="#E8702A" stroke-width="1" stroke-opacity="0.75"/>
    <rect x="380" y="28" width="86" height="9" rx="4.5" fill="#F2F1EE" opacity="0.6"/>
    <rect x="474" y="26" width="76" height="13" rx="6.5" fill="#E8702A" opacity="0.25"/>
    <rect x="380" y="60" width="164" height="7" rx="3.5" fill="#C3C2B7" opacity="0.4"/>
    <rect x="380" y="74" width="140" height="7" rx="3.5" fill="#C3C2B7" opacity="0.4"/>
    <rect x="380" y="88" width="152" height="7" rx="3.5" fill="#C3C2B7" opacity="0.4"/>
    <rect x="380" y="102" width="110" height="7" rx="3.5" fill="#C3C2B7" opacity="0.4"/>
    <rect x="376" y="236" width="186" height="44" rx="9" fill="#232327"/>
    <rect x="382" y="244" width="174" height="28" rx="8" fill="#2A2522"/>
  </g>
</svg>
